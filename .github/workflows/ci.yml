name: ForgeDB CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Build ForgeDB
        run: ./scripts/build.sh

      - name: Run test suite
        run: ./scripts/test.sh